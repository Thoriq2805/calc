<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Calculator | Thoriq Fariz</title>
</head>

<body>

    <!-- WRAPPER DIMULAI -->
    <div class="wrapper">

        <!-- SCREEN -->
        <section class="screen">

            <div class="previous-operation"></div>

            <div class="current-number">
                0
            </div>

        </section>


        <!-- BUTTONS -->
        <section class="calc-buttons">

            <!-- BARIS 1 -->
            <div class="calc-button-row">

                <button class="calc-button double">
                    C
                </button>

                <button class="calc-button">
                    &larr;
                </button>

                <button class="calc-button">
                    &divide;
                </button>

            </div>


            <!-- BARIS 2 -->
            <div class="calc-button-row">

                <button class="calc-button">
                    7
                </button>

                <button class="calc-button">
                    8
                </button>

                <button class="calc-button">
                    9
                </button>

                <button class="calc-button">
                    &times;
                </button>

            </div>


            <!-- BARIS 3 -->
            <div class="calc-button-row">

                <button class="calc-button">
                    4
                </button>

                <button class="calc-button">
                    5
                </button>

                <button class="calc-button">
                    6
                </button>

                <button class="calc-button">
                    &minus;
                </button>

            </div>


            <!-- BARIS 4 -->
            <div class="calc-button-row">

                <button class="calc-button">
                    1
                </button>

                <button class="calc-button">
                    2
                </button>

                <button class="calc-button">
                    3
                </button>

                <button class="calc-button">
                    &plus;
                </button>

            </div>


            <!-- BARIS 5 -->
            <div class="calc-button-row">

                <button class="calc-button triple">
                    0
                </button>

                <button class="calc-button">
                    &equals;
                </button>

            </div>

        </section>

    </div>
    <!-- WRAPPER SELESAI -->


    <script src="script.js"></script>

</body>

</html>
